name: sid-nimba-distribution

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_AIRFLOW}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    PYTHONPATH: /opt/airflow/project
    # Connexion du package etl/ à la base dwh / erp_source (résolution par nom de service)
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB_ERP: ${POSTGRES_DB_ERP}
    POSTGRES_DB_DWH: ${POSTGRES_DB_DWH}
  volumes:
    - ./etl/dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - ./etl:/opt/airflow/project/etl
    - ./data:/opt/airflow/project/data
    - ./sql:/opt/airflow/project/sql
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: sid_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
      - ./sql:/docker-entrypoint-initdb.d/sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  etl-tools:
    build:
      context: .
      dockerfile: docker/etl/Dockerfile
    container_name: sid_etl_tools
    profiles: ["tools"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB_ERP: ${POSTGRES_DB_ERP}
      POSTGRES_DB_DWH: ${POSTGRES_DB_DWH}
      PYTHONPATH: /app
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python3", "-m", "etl.run_pipeline", "--step", "all"]

  airflow-init:
    <<: *airflow-common
    container_name: sid_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --firstname Admin \
          --lastname Nimba \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL:-admin@nimba-distribution.example}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" || true

  airflow-webserver:
    <<: *airflow-common
    container_name: sid_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    container_name: sid_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  superset:
    build:
      context: docker/superset
      dockerfile: Dockerfile
    container_name: sid_superset
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB_SUPERSET: ${POSTGRES_DB_SUPERSET}
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL}
    volumes:
      - superset_home:/app/superset_home
      - ./dashboard/assets:/app/assets:ro
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/app/docker-init.sh"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8088/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  superset-provision:
    build:
      context: .
      dockerfile: docker/etl/Dockerfile
    container_name: sid_superset_provision
    environment:
      SUPERSET_URL: http://superset:8088
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB_DWH: ${POSTGRES_DB_DWH}
      PYTHONPATH: /app
    volumes:
      - ./:/app
    depends_on:
      superset:
        condition: service_healthy
    command: ["python3", "dashboard/provision_dashboard.py"]
    restart: "no"

volumes:
  pgdata:
  airflow_logs:
  superset_home:
